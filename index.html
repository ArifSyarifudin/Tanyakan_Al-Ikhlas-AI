body {

.header {

.btn-icon {

}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.ai { align-self: flex-start; }
.avatar {

display: flex; align-items: center; justify-content: center;
font-size: 1.2em; flex-shrink: 0;
}
.message.user .avatar { background: #3b82f6; }
.message.ai .avatar { background: #8b5cf6; }

.message.user .bubble { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
.message.ai .bubble { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 4px; }
.bubble-content { word-wrap: break-word; }
.bubble-content img { max-width: 100%; border-radius: 8px; margin: 10px 0; }

.bubble-content td { padding: 6px 10px; border-bottom: 1px solid #334155; }
.bubble-content td:first-child { font-weight: bold; color: #93c5fd; }
.bubble-content .sacred-text {
font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', 'Times New Roman', serif;
font-size: 1.8em;
direction: rtl;
text-align: right;
line-height: 2.2;

padding: 18px;
background: #0f172a;
border-radius: 10px;
margin: 12px 0;
border: 1px solid #334155;
}

font-style: italic;
color: #a5b4fc;
padding: 12px;
background: #1e293b;

border-radius: 4px;
line-height: 1.8;
}
.bubble-content .translation-text {
color: #d1d5db;
padding: 12px;

.action-btn:hover { background: #334155; color: white; }

.input-wrapper:focus-within { border-color: #3b82f6; }

.input-btn { background: transparent; border: none; color: #94a3b8; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 1.2em; }
.input-btn:hover { background: #334155; color: white; }

.status-bar { background: #1e293b; padding: 5px 20px; font-size: 0.75em; color: #64748b; border-top: 1px solid #334155; display: flex; justify-content: space-between; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.status-dot.online { background: #22c55e; }

@media (max-width: 600px) { .message { max-width: 95%; } .header-title { font-size: 1em; } }

1. **TEKS ARAB**: SELALU tulis teks Arab dengan HARAKAT (tanda baca) yang lengkap dan akurat. Gunakan format Unicode Arab yang benar.
2. **TRANSLITERASI**: Sertakan bacaan latin (transliterasi) untuk membantu pembaca Indonesia.

   - Kitab: [Nama Kitab] oleh [Pengarang], hal. [halaman]
5. **AKURASI**: JANGAN PERNAH mengarang ayat Quran atau hadits. Jika tidak yakin, katakan "Saya perlu memverifikasi lebih lanjut."
6. **METODE**: Jelaskan dengan metode yang sistematis (definisi, dalil, penjelasan, contoh, kesimpulan).
7. **BAHASA**: Jawab dalam Bahasa Indonesia yang baik, santun, dan mudah dipahami.

- Untuk ayat Quran: Teks Arab berharakat → Transliterasi → Terjemahan → Tafsir ringkas → Sumber
- Untuk hadits: Teks Arab → Transliterasi → Terjemahan → Derajat hadits → Sumber
- Untuk fiqih: Masalah → Dalil → Pendapat ulama → Kesimpulan
- Untuk nahwu/sharaf: Contoh → Analisis → Kaidah → Latihan

Jawablah dengan mendalam, komprehensif, dan berdasarkan sumber-sumber yang terpercaya (Al-Quran, As-Sunnah, Ijma', Qiyas, dan pendapat ulama yang mu'tabar).`;

async function fetchWithRetry(url, opts = {}, retries = 2, timeout = 10000) {
for (let i = 0; i <= retries; i++) {
try {
const ctrl = new AbortController();
const tid = setTimeout(() => ctrl.abort(), timeout);
const res = await fetch(url, { ...opts, signal: ctrl.signal });
clearTimeout(tid);
if (!res.ok) throw new Error(`HTTP ${res.status}`);
return res;
} catch (e) {
if (i === retries) {
if (!url.includes('corsproxy.io')) {
try { const pr = await fetch(API.corsProxy(url), opts); if (pr.ok) return pr; } catch (_) {}
}
throw e;
}
await new Promise(r => setTimeout(r, 500 * (i + 1)));
}
}
}

function parseMarkdownToHTML(text) {
if (!text) return '';
// Code blocks
text = text.replace(/```[a-z]*\n?([\s\S]*?)```/gi, '<pre>$1</pre>');
text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
// Bold & Italic
text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
// Headers
text = text.replace(/^### (.*$)/gm, '<h3 style="color:#93c5fd;margin:10px 0 5px;">$1</h3>');
text = text.replace(/^## (.*$)/gm, '<h2 style="color:#60a5fa;margin:12px 0 6px;">$1</h2>');
text = text.replace(/^# (.*$)/gm, '<h1 style="color:#3b82f6;margin:14px 0 8px;">$1</h1>');
// Lists
text = text.replace(/^- (.*$)/gm, '• $1<br>');
text = text.replace(/^\d+\. (.*$)/gm, '$1<br>');
// Links
text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#60a5fa;">$1</a>');
// Newlines
text = text.replace(/\n/g, '<br>');
return text;
}

// Deteksi pertanyaan spesifik Quran (untuk pakai API Quran)
function detectQuranQuery(q) {
const s = q.toLowerCase();
// Pattern: "surah [nama/nomor]" atau "ayat [nomor] surah [nama]" atau "[nama surah] ayat [nomor]"
const surahMatch = s.match(/surah\s+([a-z\s]+?)(?:\s+(?:ayat|ayatnya?|pasal)|\s*$|[\s,])/);
const ayahMatch = s.match(/(?:ayat|ayatnya?)\s+(\d+)/);
const surahNumberMatch = s.match(/surah\s+(\d+)/);
return {
isQuran: /\b(quran|al-quran|alquran|al quran|ayat|surah|juz|tafsir)\b/i.test(s),
surahName: surahMatch ? surahMatch[1].trim() : null,
surahNumber: surahNumberMatch ? parseInt(surahNumberMatch[1]) : null,
ayahNumber: ayahMatch ? parseInt(ayahMatch[1]) : null,
count: (s.match(/\b(\d+)\s*(?:ayat|surah)/) || [])[1] ? parseInt((s.match(/\b(\d+)\s*(?:ayat|surah)/) || [])[1]) : null
};
}

// Deteksi pertanyaan Hadits (untuk pakai API Hadits)
function detectHadithQuery(q) {
const s = q.toLowerCase();
const bookMatch = s.match(/\b(bukhari|muslim|abu\s*dawud|tirmidzi|nasai|ibnu\s*majah)\b/);
const numberMatch = s.match(/no\.?\s*(\d+)|nomor\s*(\d+)|no\s+(\d+)/);
return {
isHadith: /\b(hadits|hadis|sunnah|bukhari|muslim|abu dawud|tirmidzi|nasai|ibnu majah)\b/i.test(s),
book: bookMatch ? bookMatch[1].trim() : null,
number: numberMatch ? (numberMatch[1] || numberMatch[2] || numberMatch[3]) : null
};
}

function detectIntent(q) {
const s = q.toLowerCase().trim();

// 1. Prioritas: Cek Database Agama (untuk jawaban instan)
const religiousCheck = findReligiousContent(s);
if (religiousCheck.found) return { type: 'religious', content: religiousCheck.content, key: religiousCheck.key, query: q };

// 2. Deteksi pertanyaan Islami (SANGAT LUAS) - ini yang utama!
if (isIslamicQuery(s)) {
const quranQ = detectQuranQuery(s);
const hadithQ = detectHadithQuery(s);
if (quranQ.isQuran) return { type: 'quran', query: q, ...quranQ };
if (hadithQ.isHadith) return { type: 'hadith', query: q, ...hadithQ };
return { type: 'islamic', query: q };
}

// 3. Deteksi pertanyaan agama umum lainnya
if (/\b(kristen|katolik|protestan|buddha|hindu|konghucu|tridharma|alkitab|injil|wedha|veda|sutta|dhamma|nabi|rasul|yesus|brahma|tian|mantra)\b/.test(s)) {
return { type: 'religious_general', query: q };
}

// 4. Cek Database Tokoh
const figureCheck = findFigureInDB(s);
if (figureCheck.found) return { type: 'figure', figure: figureCheck.figure, key: figureCheck.key, query: q };

// 5. Deteksi pertanyaan faktual umum
if (/\b(siapa|kapan|dimana|berapa|mengapa|bagaimana|apa|wafat|meninggal|lahir|presiden|menteri|gubernur)\b/.test(s)) {
return { type: 'general_search', query: q };
}

// 6. Handler khusus lainnya
if (/\b(cuaca|weather|suhu)\b/.test(s)) {
const city = s.replace(/cuaca|weather|suhu|hari ini|sekarang|di|kota|berapa|panas|dingin|hujan|cerah/gi, '').trim() || 'Jakarta';
return { type: 'weather', city };
}
if (/\b(negara|country|ibu kota)\b/.test(s)) return { type: 'country', country: s.replace(/negara|country|info|tentang|ibu kota/gi, '').trim() };
if (/\b(arti|definisi|makna)\b/.test(s)) return { type: 'dictionary', word: s.replace(/arti|definisi|makna|kata/gi, '').trim() };
if (/\b(gambar|image|foto|buatkan gambar)\b/.test(s)) return { type: 'image', prompt: s.replace(/buatkan|gambar|image|foto|tolong/gi, '').trim() };
if (/\b(jam|waktu|pukul)\b/.test(s)) return { type: 'time', timezone: s.match(/\b(di|kota)\s+([a-z\s]+?)/i)?.[2]?.trim() || '' };
if (/\b(kurs|rupiah|dollar|usd|idr)\b/.test(s)) return { type: 'exchange', from: 'USD', to: 'IDR', amount: 1 };
if (/^[\d\s\+\-\*\/\(\)\.\,]+$/.test(s.replace(/hitung|calculate/gi, '').trim())) return { type: 'calc', expr: s.replace(/hitung|calculate|=/gi, '').trim() };
if (/\b(terjemahkan|translate)\b/.test(s)) return { type: 'translate', text: s, lang: 'inggris' };
if (/\b(ip|ip saya)\b/.test(s)) return { type: 'ip' };
if (/\b(pokemon|poke)\b/.test(s)) return { type: 'pokemon', name: s.replace(/pokemon|info/gi, '').trim() || 'pikachu' };
if (/\b(resep|masakan)\b/.test(s)) return { type: 'meal', food: s.replace(/resep|masakan|cara membuat/gi, '').trim() || 'chicken' };
if (/\b(quote|motivasi)\b/.test(s)) return { type: 'quote' };
if (/\b(lelucon|joke|lucu)\b/.test(s)) return { type: 'joke' };
if (/\b(fakta|angka|number)\b/.test(s) && /\b(\d+)\b/.test(s)) return { type: 'numberfact', number: s.match(/\b(\d+)\b/)[1] };
if (/\b(kucing|cat)\b/.test(s)) return { type: 'catfact' };
if (/\b(anjing|dog)\b/.test(s)) return { type: 'dog' };
if (/\b(github)\b/.test(s)) return { type: 'github', user: s.replace(/github|user/gi, '').trim() };

return { type: 'general_search', query: q };
}

async function fetchQuranData(intent) {
setApiStatus('Mengambil data Quran...');
try {
let surahNum = intent.surahNumber;
// Jika ada nama surah, cari nomornya
if (!surahNum && intent.surahName) {
const listRes = await fetchWithRetry(API.quran.surahList, {}, 1, 8000);
const listData = await listRes.json();
if (listData.data) {
const found = listData.data.find(s =>
s.englishName.toLowerCase().includes(intent.surahName) ||
s.name.toLowerCase().includes(intent.surahName) ||
s.englishNameTranslation.toLowerCase().includes(intent.surahName)
);
if (found) surahNum = found.number;
}
}
if (!surahNum) return null;

const res = await fetchWithRetry(API.quran.byNumber(surahNum), {}, 1, 8000);
const data = await res.json();
if (data.code === 200 && data.data) {
const arabicEdition = data.data.editions.find(e => e.language === 'ar');
const idEdition = data.data.editions.find(e => e.language === 'id');
return {
surahName: data.data.englishName,
surahNameAr: data.data.name,
count: data.data.numberOfAyahs,
ayahs: arabicEdition.ayahs.map((a, i) => ({
number: a.numberInSurah,
arabic: a.text,
translation: idEdition ? idEdition.ayahs[i].text : '',
numberGlobal: a.number
}))
};
}
} catch (e) { console.log('Quran API failed:', e); }
return null;
}

async function fetchHadithData(intent) {

const num = intent.number || 1;

else if (book.includes('tirmidzi')) url = API.hadith.tirmidzi(num);
else if (book.includes('nasai')) url = API.hadith.nasai(num);
else if (book.includes('ibnumajah') || book.includes('ibn')) url = API.hadith.ibnuMajah(num);
else url = API.hadith.bukhari(num);

const res = await fetchWithRetry(url, {}, 1, 8000);
const data = await res.json();
if (data.data) {
return {
book: data.data.available ? data.data.available.name : book,
number: data.data.number,
arabic: data.data.arab,
translation: data.data.id
};
}
} catch (e) { console.log('Hadith API failed:', e); }
return null;
}

if (/\b(tafsir|makna|penjelasan|arti)\b/i.test(q)) {
html += `<br><strong>📚 Tafsir Ringkas:</strong><br>`;
const tafsirPrompt = `Berikan tafsir ringkas dalam bahasa Indonesia untuk Surah ${quranData.surahName} ayat 1-${ayahsToShow.length}. Sertakan asbabun nuzul jika ada, dan pelajaran yang bisa diambil. Gunakan format yang rapi dengan teks Arab berharakat jika ada kutipan.`;
const tafsirResult = await getAIResponse(tafsirPrompt, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (tafsirResult.success) {
html += tafsirResult.text;
usedAI = true;
}
}
} else {
// Fallback ke AI jika API Quran gagal
const aiResult = await getAIResponse(q, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (aiResult.success) {
html = aiResult.text;
usedAI = true;
} else {
throw new Error('Gagal mengambil data Quran');
}
}
}

// === PRIORITAS 2: HADITS (API KHUSUS) ===
else if (intent.type === 'hadith') {
setStatus('Mengambil data Hadits...', 'online');
const hadithData = await fetchHadithData(intent);

if (hadithData) {
usedAPI = true;
html = `<strong>📚 Hadits ${hadithData.book}</strong><br>`;
html += `<em style="color:#94a3b8;font-size:0.85em;">Nomor: ${hadithData.number}</em><br><br>`;
html += `<div class="sacred-text">${hadithData.arabic}</div>`;
html += `<div class="translation-text"><strong> Terjemahan:</strong><br>${hadithData.translation}</div>`;
html += `<div class="source-text">📚 Sumber: API Hadits Gading Dev</div>`;

// Tambahkan penjelasan jika user minta
if (/\b(jelaskan|penjelasan|makna|tafsir|syarah|derajat|sanad)\b/i.test(q)) {
html += `<br><strong> Penjelasan:</strong><br>`;
const syarahPrompt = `Berikan penjelasan/syarah singkat dalam bahasa Indonesia untuk hadits berikut:\nArab: ${hadithData.arabic}\nTerjemahan: ${hadithData.translation}\n\nSertakan: derajat hadits, pelajaran utama, dan konteks. Gunakan teks Arab berharakat jika perlu.`;
const syarahResult = await getAIResponse(syarahPrompt, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (syarahResult.success) {
html += syarahResult.text;
usedAI = true;
}
}
} else {
// Fallback ke AI
const aiResult = await getAIResponse(q, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (aiResult.success) {
html = aiResult.text;
usedAI = true;
} else {
throw new Error('Gagal mengambil data Hadits');
}
}
}

// === PRIORITAS 3: ISLAM UMUM (AI DENGAN SYSTEM PROMPT KAYA) ===
else if (intent.type === 'islamic') {
setStatus('Menganalisis khazanah Islam...', 'online');
setApiStatus('Islamic AI Engine Active');

// Coba web search untuk konteks tambahan (opsional, tidak wajib)
const searchResult = await searchWeb(q);
const context = searchResult.success ? searchResult.context : null;

// Panggil AI dengan system prompt Islam yang sangat kaya
// TIDAK strict mode - biarkan AI pakai pengetahuan internalnya
const aiResult = await getAIResponse(q, context, ISLAMIC_SYSTEM_PROMPT, 0.3);

if (aiResult.success) {
html = aiResult.text;
usedAI = true;
if (searchResult.success) usedSearch = true;
} else {
// Fallback: coba tanpa search context
const aiResult2 = await getAIResponse(q, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (aiResult2.success) {
html = aiResult2.text;
usedAI = true;
} else {
throw new Error('AI gagal merespons');
}
}
}

// === PRIORITAS 4: AGAMA UMUM LAINNYA ===
else if (intent.type === 'religious_general') {
const searchResult = await searchWeb(q);
if (searchResult.success) {
const aiResult = await getAIResponse(q, searchResult.context, null, 0.4);
if (aiResult.success) {
html = aiResult.text;
usedSearch = true;
usedAI = true;
} else {
throw new Error('AI gagal');
}
} else {
const aiResult = await getAIResponse(q, null, null, 0.4);
if (aiResult.success) {
html = aiResult.text;
usedAI = true;
} else {
throw new Error('AI gagal');
}
}
}

// === PRIORITAS 5: TOKOH ===
else if (intent.type === 'figure') {
const f = intent.figure;
html = `<strong>👤 ${f.name}</strong><br><br><table>
<tr><td>Nama</td><td><strong>${f.name}</strong></td></tr>
<tr><td>Peran</td><td>${f.role}</td></tr>
<tr><td>Lahir</td><td>📅 ${f.birth}</td></tr>
<tr><td>Wafat/Status</td><td>${f.death ? '🕊️ ' + f.death : '✅ Masih Hidup'}</td></tr>
${f.note ? `<tr><td>Catatan</td><td>${f.note}</td></tr>` : ''}
</table><div style="margin-top:10px;font-size:0.8em;color:#94a3b8;border-top:1px solid #334155;padding-top:8px;">
<span class="api-badge verified-badge">✅ Data Terverifikasi</span></div>`;
}

// === PRIORITAS 6: RELIGIOUS DB (JAWABAN INSTAN) ===
else if (intent.type === 'religious') {
const c = intent.content;
html = `<strong>📜 ${c.name} <span style="font-size:0.8em;color:#94a3b8;">(${c.religion})</span></strong><br><br>
<div class="sacred-text">${c.text}</div>
${c.latin !== '-' ? `<div class="latin-text"><strong>🔤 Bacaan:</strong><br>${c.latin}</div>` : ''}
<div class="translation-text"><strong>📖 Arti/Makna:</strong><br>${c.translation}</div>
<div class="source-text">📚 Sumber: ${c.source}</div>
<div style="margin-top:10px;font-size:0.8em;color:#94a3b8;border-top:1px solid #334155;padding-top:8px;">
<span class="api-badge verified-badge">✅ Teks Terverifikasi</span></div>`;
}

// === PRIORITAS 7: UMUM ===
else {
const searchResult = await searchWeb(q);
if (searchResult.success) {
const aiResult = await getAIResponse(q, searchResult.context, null, 0.5);
if (aiResult.success) {
html = aiResult.text;
usedSearch = true;
usedAI = true;
} else {
throw new Error('AI gagal');
}
} else {
const aiResult = await getAIResponse(q, null, null, 0.5);
if (aiResult.success) {
html = aiResult.text;
usedAI = true;
} else {
throw new Error('AI gagal');
}
}
}

// Tambahkan badge sumber
if (usedAI || usedSearch || usedAPI) {
html += `<div style="margin-top:10px;font-size:0.8em;color:#94a3b8;border-top:1px solid #334155;padding-top:8px;">`;
if (intent.type === 'quran') {
html += `<span class="api-badge verified-badge">📖 Quran API</span>`;
} else if (intent.type === 'hadith') {
html += `<span class="api-badge verified-badge">📚 Hadith API</span>`;
} else if (intent.type === 'islamic') {
html += `<span class="api-badge verified-badge">🕌 Islamic AI Engine</span>`;
} else {
html += `<span class="api-badge verified-badge">✅ Diverifikasi</span>`;
}
if (usedSearch) html += `<span class="api-badge" style="background:#4285f4;">🔍 Web Search</span>`;
if (usedAI) html += `<span class="api-badge" style="background:#8b5cf6;">🤖 AI Model</span>`;
html += `</div>`;
}

removeTyping();
addMessage(html, 'ai', true);
setStatus('Selesai', 'online');
} catch (e) {
removeTyping();
const genericResponse = `<strong>🔍 Tentang: "${q}"</strong><br><br>
<p>Maaf, terjadi kendala saat memproses pertanyaan. Silakan coba lagi atau cek langsung:</p>
<ul style="margin-left:20px;margin:10px 0;">
<li>🔎 <a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" style="color:#60a5fa;">Google</a></li>
<li> <a href="https://id.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(q)}" target="_blank" style="color:#60a5fa;">Wikipedia</a></li>
${isIslamicQuery(q) ? `<li>🕌 <a href="https://quran.com/" target="_blank" style="color:#60a5fa;">Quran.com</a></li>
<li>📚 <a href="https://sunnah.com/" target="_blank" style="color:#60a5fa;">Sunnah.com (Hadits)</a></li>` : ''}
</ul>`;
addMessage(genericResponse, 'ai', true);
setStatus('Gagal', 'offline');
} finally {
isProcessing = false;
document.getElementById('sendBtn').disabled = false;
inp.focus();
}
}

// ============================================
// 13. INPUT SUARA & INIT
// ============================================
function startVoice() {
if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
alert('Browser tidak mendukung input suara. Gunakan Chrome.'); return;
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = new SR(); rec.lang = 'id-ID'; rec.interimResults = false;
const btn = document.querySelector('.input-btn');
btn.textContent = '🔴'; btn.style.color = '#ef4444';
rec.onresult = (e) => { document.getElementById('chatInput').value = e.results[0][0].transcript; autoResize(document.getElementById('chatInput')); };
rec.onend = rec.onerror = () => { btn.textContent = ''; btn.style.color = '#94a3b8'; };
rec.start();
}

window.onload = () => {
document.getElementById('chatContainer').innerHTML = getWelcomeHTML();
document.getElementById('chatInput').focus();
};
</script>
</body>
