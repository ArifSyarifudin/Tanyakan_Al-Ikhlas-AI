<body>
<div class="header">
<div class="header-title"><span>🤖</span> Tanyakan Al-Khlas AI</div>

</div>
<div class="chat-container" id="chatContainer"></div>
<div class="input-area">
<div class="input-wrapper">
<textarea id="chatInput" rows="1" placeholder="Tanyakan apa saja (Quran, Hadits, Fiqih, Nahwu, dll)..." oninput="autoResize(this)" onkeypress="handleKeyPress(event)"></textarea>

<script>
// ============================================
// 1. KONFIGURASI API
// ============================================
const API = {
searxng: ['https://search.sapti.web.id/search', 'https://searx.be/search', 'https://search.ononoki.org/search'],
aiPost: 'https://text.pollinations.ai/openai',
quran: {
byNumber: (n) => `https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,id.indonesian`,
byName: (name) => `https://api.alquran.cloud/v1/surah/${encodeURIComponent(name)}/editions/quran-uthmani,id.indonesian`,
search: (q) => `https://api.alquran.cloud/v1/search/${encodeURIComponent(q)}/all/id.indonesian`,
surahList: 'https://api.alquran.cloud/v1/surah',
ayah: (surah, number) => `https://api.alquran.cloud/v1/ayah/${surah}:${number}/editions/quran-uthmani,id.indonesian`
},
hadith: {
bukhari: (n) => `https://api.hadith.gading.dev/books/bukhari/${n}`,
muslim: (n) => `https://api.hadith.gading.dev/books/muslim/${n}`,
abuDaud: (n) => `https://api.hadith.gading.dev/books/abudaud/${n}`,
tirmidzi: (n) => `https://api.hadith.gading.dev/books/tirmidzi/${n}`,
nasai: (n) => `https://api.hadith.gading.dev/books/nasai/${n}`,
ibnuMajah: (n) => `https://api.hadith.gading.dev/books/ibnumajah/${n}`,
books: 'https://api.hadith.gading.dev/books'
},
corsProxy: (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
};

// ============================================
// 2. SYSTEM PROMPT KHUSUS ISLAM (SANGAT KAYA & TEGAS)
// ============================================
const ISLAMIC_SYSTEM_PROMPT = `Kamu adalah "Al-Khlas AI" — asisten AI ULTRA CERDAS dan AHLI KOMPREHENSIF dalam Khazanah Islam. 
## BIDANG KEAHLIAN: Al-Quran (Tafsir, Asbabun Nuzul), Hadits (Kutubus Sittah, Sanad, Matan, Derajat), Fiqih (4 Mazhab, Ushul, Qawaid), Aqidah, Akhlak, Tasawuf, Nahwu, Sharaf, Balaghah, Sirah, dan Ulumul Quran.
## ATURAN MUTLAK:
1. TEKS ARAB: SELALU tulis teks Arab dengan HARAKAT lengkap dan akurat.
2. TRANSLITERASI & TERJEMAHAN: Sertakan bacaan latin dan terjemahan Bahasa Indonesia yang baik.
3. SUMBER: SELALU cantumkan sumber spesifik (QS. Surah:Ayat, HR. Bukhari no.X, Kitab nama hal.X).
4. JANGAN PERNAH mengarang ayat/hadits. Jika tidak yakin, katakan "Perlu verifikasi lebih lanjut" tapi tetap berikan penjelasan ilmiah berdasarkan kaidah yang ada.
5. JANGAN PERNAH memberikan link pencarian Google, Wikipedia, atau menyuruh pengguna mencari sendiri. Kamu HARUS menjawab langsung dengan pengetahuanmu secara lengkap, mendalam, dan terstruktur.
6. METODE: Jelaskan dengan sistematis (Definisi → Dalil → Penjelasan Ulama → Kesimpulan).`;

// ============================================
// 3. BASIS DATA AGAMA & TOKOH (DIPERTAHANKAN)
// ============================================
const RELIGIOUS_DB = {
'sholawat nariyah': { religion: 'Islam', name: 'Sholawat Nariyah', text: 'اَللّٰهُمَّ صَلِّ صَلَاةً كَامِلَةً وَسَلِّمْ سَلَامًا تَامًّا عَلَى سَيِّدِنَا مُحَمَّدٍ...', latin: 'Allaahumma sholli sholaatan kaamilatan wa sallim salaaman taamman \'alaa sayyidinaa Muhammadin...', translation: 'Ya Allah, limpahkanlah shalawat yang sempurna dan salam yang sempurna kepada junjungan kami Nabi Muhammad...', source: 'Dianjurkan dibaca 11x setelah Subuh' },
'doa nabi adam': { religion: 'Islam', name: 'Doa Nabi Adam AS', text: 'رَبَّنَا ظَلَمْنَا اَنْفُسَنَا وَاِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُوْنَنَّ مِنَ الْخَاسِرِيْنَ', latin: 'Rabbanaa zholamnaa anfusanaa wa il lam taghfir lanaa wa tarhamnaa lanakuunanna minal-khaasiriin.', translation: 'Ya Tuhan kami, kami telah menganiaya diri kami sendiri...', source: 'QS. Al-A\'raf: 23' },
'al-fatihah': { religion: 'Islam', name: 'QS. Al-Fatihah', text: 'بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ ۝ اَلْحَمْدُ لِلّٰهِ رَبِّ الْعٰلَمِيْنَ...', latin: 'Bismillaahir-rahmaanir-rahiim. Alhamdu lillaahi rabbil-\'aalamiin...', translation: 'Dengan nama Allah Yang Maha Pengasih, Maha Penyayang...', source: 'QS. Al-Fatihah: 1-7' }
};
const FIGURE_DB = {
'kh zainuddin mz': { name: 'KH. Zainuddin MZ', birth: '1951', death: '5 Juli 2011', role: 'Ulama & Dai kondang', note: 'Wafat di Jakarta' },
'hamka': { name: 'Prof. Dr. Hamka', birth: '17 Februari 1908', death: '24 Juli 1981', role: 'Ulama, Sastrawan, Politisi', note: 'Mantan Ketua MUI' }
};

let isProcessing = false;

// ============================================
// 4. FUNGSI UTILITAS & UI
// ============================================
function getWelcomeHTML() {
return `<div class="welcome-screen" id="welcomeScreen">
<div class="logo">🤖</div>
<h2>Tanyakan Al-Khlas AI</h2>
<p>Asisten AI Ahli Khazanah Islam — siap menjawab pertanyaan mendalam tentang <strong>Al-Quran, Hadits, Fiqih, Aqidah, Akhlak, Tasawuf, Nahwu, Sharaf, Balaghah, Tafsir, Sirah</strong>, serta topik umum lainnya.</p>
<div class="hint">💡 Coba tanya:<br>• "Tuliskan 7 ayat pertama Surah Yasin beserta tafsirnya"<br>• "Jelaskan kaidah fiqih Al-Yaqinu La Yuzalu Bisy-Syak"<br>• "Apa itu i'rab dalam ilmu Nahwu?"</div>
</div>`;
}
function autoResize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
function handleKeyPress(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function setStatus(t, status = 'online') {
document.getElementById('statusText').textContent = t;
document.getElementById('statusDot').className = `status-dot ${status}`;
}
function setApiStatus(t) { document.getElementById('apiStatus').textContent = `Sistem: ${t}`; }
function clearChat() {
const container = document.getElementById('chatContainer');
const messages = container.querySelectorAll('.message');
if (messages.length === 0) return;
messages.forEach((msg, index) => setTimeout(() => msg.classList.add('fade-out'), index * 30));
setTimeout(() => {
container.innerHTML = getWelcomeHTML();
setStatus('Siap', 'online');
setApiStatus('Islamic Knowledge Engine: Active');
}, messages.length * 30 + 300);
}
async function fetchWithRetry(url, opts = {}, retries = 2, timeout = 10000) {
for (let i = 0; i <= retries; i++) {
try {
const ctrl = new AbortController();
const tid = setTimeout(() => ctrl.abort(), timeout);
const res = await fetch(url, { ...opts, signal: ctrl.signal });
clearTimeout(tid);
if (!res.ok) throw new Error(`HTTP ${res.status}`);
return res;
} catch (e) {
if (i === retries) {
if (!url.includes('corsproxy.io')) {
try { const pr = await fetch(API.corsProxy(url), opts); if (pr.ok) return pr; } catch (_) {}
}
throw e;
}
await new Promise(r => setTimeout(r, 500 * (i + 1)));
}
}
}

// ============================================
// 5. PARSER MARKDOWN
// ============================================
function parseMarkdownToHTML(text) {
if (!text) return '';
text = text.replace(/```[a-z]*\n?([\s\S]*?)```/gi, '<pre>$1</pre>');
text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
text = text.replace(/^### (.*$)/gm, '<h3 style="color:#93c5fd;margin:10px 0 5px;">$1</h3>');
text = text.replace(/^## (.*$)/gm, '<h2 style="color:#60a5fa;margin:12px 0 6px;">$1</h2>');
text = text.replace(/^# (.*$)/gm, '<h1 style="color:#3b82f6;margin:14px 0 8px;">$1</h1>');
text = text.replace(/^- (.*$)/gm, '• $1<br>');
text = text.replace(/^\d+\. (.*$)/gm, '$1<br>');
text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#60a5fa;">$1</a>');
text = text.replace(/\n/g, '<br>');
return text;
}

// ============================================
// 6. DETEKSI INTENSI
// ============================================
function findReligiousContent(query) {
const q = query.toLowerCase().trim().replace(/\s+/g, ' ');
for (const [key, content] of Object.entries(RELIGIOUS_DB)) {
if (q.includes(key) || q.includes(content.name.toLowerCase())) return { found: true, content, key };
}
return { found: false };
}
function findFigureInDB(query) {
const q = query.toLowerCase().trim();
for (const [key, figure] of Object.entries(FIGURE_DB)) {
if (q.includes(key) || q.includes(figure.name.toLowerCase())) return { found: true, figure, key };
}
return { found: false };
}
function isIslamicQuery(q) {
const s = q.toLowerCase();
const keywords = ['quran','al-quran','alquran','ayat','surah','juz','tafsir','hadits','hadis','sunnah','bukhari','muslim','fiqih','fikih','fiqh','mazhab','syafi\'i','hanafi','maliki','hanbali','fatwa','aqidah','akidah','tauhid','akhlak','akhlaq','tasawuf','tarekat','nahwu','sharaf','sorof','i\'rab','irab','wazan','balaghah','shalat','salat','puasa','zakat','haji','doa','dzikir','sholawat','shalawat','islam','muslim','nabi','rasul','muhammad','allah','ulama','imam','syekh','kiai','ustadz','kitab','halal','haram','wajib','sunah','sunnah','sirah','muamalah','munakahat','jinayah','siyasah','bid\'ah','tasyabbuh'];
return keywords.some(k => s.includes(k));
}
function detectQuranQuery(q) {
const s = q.toLowerCase();
const surahMatch = s.match(/surah\s+([a-z\s]+?)(?:\s+(?:ayat|ayatnya?|pasal)|\s*$|[\s,])/);
const ayahMatch = s.match(/(?:ayat|ayatnya?)\s+(\d+)/);
const surahNumberMatch = s.match(/surah\s+(\d+)/);
return {
isQuran: /\b(quran|al-quran|alquran|al quran|ayat|surah|juz|tafsir)\b/i.test(s),
surahName: surahMatch ? surahMatch[1].trim() : null,
surahNumber: surahNumberMatch ? parseInt(surahNumberMatch[1]) : null,
ayahNumber: ayahMatch ? parseInt(ayahMatch[1]) : null,
count: (s.match(/\b(\d+)\s*(?:ayat|surah)/) || [])[1] ? parseInt((s.match(/\b(\d+)\s*(?:ayat|surah)/) || [])[1]) : null
};
}
function detectHadithQuery(q) {
const s = q.toLowerCase();
const bookMatch = s.match(/\b(bukhari|muslim|abu\s*dawud|tirmidzi|nasai|ibnu\s*majah)\b/);
const numberMatch = s.match(/no\.?\s*(\d+)|nomor\s*(\d+)|no\s+(\d+)/);
return {
isHadith: /\b(hadits|hadis|sunnah|bukhari|muslim|abu dawud|tirmidzi|nasai|ibnu majah)\b/i.test(s),
book: bookMatch ? bookMatch[1].trim() : null,
number: numberMatch ? (numberMatch[1] || numberMatch[2] || numberMatch[3]) : null
};
}
function detectIntent(q) {
const s = q.toLowerCase().trim();
const religiousCheck = findReligiousContent(s);
if (religiousCheck.found) return { type: 'religious', content: religiousCheck.content, key: religiousCheck.key, query: q };
if (isIslamicQuery(s)) {
const quranQ = detectQuranQuery(s);
const hadithQ = detectHadithQuery(s);
if (quranQ.isQuran) return { type: 'quran', query: q, ...quranQ };
if (hadithQ.isHadith) return { type: 'hadith', query: q, ...hadithQ };
return { type: 'islamic', query: q };
}
if (/\b(kristen|katolik|protestan|buddha|hindu|konghucu|tridharma|alkitab|injil|wedha|veda|sutta|dhamma)\b/.test(s)) return { type: 'religious_general', query: q };
const figureCheck = findFigureInDB(s);
if (figureCheck.found) return { type: 'figure', figure: figureCheck.figure, key: figureCheck.key, query: q };
return { type: 'general_search', query: q };
}

// ============================================
// 7. PENCARIAN WEB & FETCH DATA
// ============================================
async function searchWeb(query) {
setStatus('Mencari data...', 'online');
setApiStatus('Web Search Active');
for (const instance of API.searxng) {
try {
const url = `${instance}?q=${encodeURIComponent(query)}&format=json&language=id&categories=general`;
const res = await fetchWithRetry(url, { headers: { 'Accept': 'application/json' } }, 1, 8000);
const data = await res.json();
if (data.results && data.results.length > 0) {
let context = `DATA DARI INTERNET UNTUK: "${query}"\n`;
data.results.slice(0, 5).forEach((r, idx) => {
context += `${idx + 1}. ${r.title}\nURL: ${r.url}\nSnippet: ${r.content || 'Tidak ada deskripsi'}\n`;
});
return { success: true, context, results: data.results.slice(0, 5) };
}
} catch (e) { continue; }
}
return { success: false, context: '', results: [] };
}

async function fetchQuranData(intent) {
setApiStatus('Mengambil data Quran...');
try {
let surahNum = intent.surahNumber;
if (!surahNum && intent.surahName) {
const listRes = await fetchWithRetry(API.quran.surahList, {}, 1, 8000);
const listData = await listRes.json();
if (listData.data) {
const found = listData.data.find(s => s.englishName.toLowerCase().includes(intent.surahName) || s.name.toLowerCase().includes(intent.surahName));
if (found) surahNum = found.number;
}
}
if (!surahNum) return null;
const res = await fetchWithRetry(API.quran.byNumber(surahNum), {}, 1, 8000);
const data = await res.json();
if (data.code === 200 && data.data) {
const arabicEdition = data.data.editions.find(e => e.language === 'ar');
const idEdition = data.data.editions.find(e => e.language === 'id');
return {
surahName: data.data.englishName,
surahNameAr: data.data.name,
count: data.data.numberOfAyahs,
ayahs: arabicEdition.ayahs.map((a, i) => ({
number: a.numberInSurah,
arabic: a.text,
translation: idEdition ? idEdition.ayahs[i].text : '',
numberGlobal: a.number
}))
};
}
} catch (e) { console.log('Quran API failed:', e); }
return null;
}

async function fetchHadithData(intent) {
setApiStatus('Mengambil data Hadits...');
try {
let url = null;
const book = (intent.book || 'bukhari').toLowerCase().replace(/\s+/g, '');
const num = intent.number || 1;
if (book.includes('bukhari')) url = API.hadith.bukhari(num);
else if (book.includes('muslim')) url = API.hadith.muslim(num);
else if (book.includes('abudaud') || book.includes('abudawud')) url = API.hadith.abuDaud(num);
else if (book.includes('tirmidzi')) url = API.hadith.tirmidzi(num);
else if (book.includes('nasai')) url = API.hadith.nasai(num);
else if (book.includes('ibnumajah') || book.includes('ibn')) url = API.hadith.ibnuMajah(num);
else url = API.hadith.bukhari(num);
const res = await fetchWithRetry(url, {}, 1, 8000);
const data = await res.json();
if (data.data) {
return { book: data.data.available ? data.data.available.name : book, number: data.data.number, arabic: data.data.arab, translation: data.data.id };
}
} catch (e) { console.log('Hadith API failed:', e); }
return null;
}

// ============================================
// 8. AI RESPONSE ENGINE (3-LAPIS FALLBACK)
// ============================================
async function getAIResponse(query, searchContext = null, systemPrompt = null, temperature = 0.3) {
setApiStatus('AI sedang berpikir...');
const strictPrompt = (systemPrompt || "Kamu adalah asisten AI yang sangat cerdas dan komprehensif. Jawab dalam Bahasa Indonesia.") + 
"\n\nATURAN MUTLAK: JANGAN PERNAH memberikan link pencarian Google, Wikipedia, atau menyuruh pengguna mencari sendiri. Kamu HARUS menjawab langsung dengan pengetahuanmu secara lengkap dan mendetail.";

// Metode 1: Pollinations OpenAI POST
try {
const res = await fetch(API.aiPost, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ model: 'openai', messages: [{ role: 'system', content: strictPrompt }, { role: 'user', content: query }], temperature: temperature })
});
if (res.ok) {
const d = await res.json();
const t = d.choices?.[0]?.message?.content || d.choices?.[0]?.text || d.response || '';
if (t && t.length > 20) return { text: parseMarkdownToHTML(t), success: true, method: 'POST' };
}
} catch (e) { console.log('AI POST failed:', e); }

// Metode 2: Pollinations GET (openai)
try {
const fullQuery = searchContext ? `${searchContext}\n\nPertanyaan: ${query}` : query;
const res = await fetchWithRetry(`https://text.pollinations.ai/${encodeURIComponent(fullQuery)}?model=openai&temperature=${temperature}`);
const t = await res.text();
if (t && t.length > 20) return { text: parseMarkdownToHTML(t), success: true, method: 'GET' };
} catch (e) { console.log('AI GET failed:', e); }

// Metode 3: Pollinations GET (openai-large) - Fallback terakhir AI
try {
const fullQuery = searchContext ? `${searchContext}\n\nPertanyaan: ${query}` : query;
const res = await fetchWithRetry(`https://text.pollinations.ai/${encodeURIComponent(fullQuery)}?model=openai-large&temperature=${temperature}`);
const t = await res.text();
if (t && t.length > 20) return { text: parseMarkdownToHTML(t), success: true, method: 'GET-large' };
} catch (e) { console.log('AI GET-large failed:', e); }

return { text: '', success: false };
}

// 9. MAIN LOGIC
// ============================================
function addMessage(text, sender, isHtml = false) {
const c = document.getElementById('chatContainer');
const w = document.getElementById('welcomeScreen');
if (w) w.remove();
const m = document.createElement('div');
m.className = `message ${sender}`;
const av = document.createElement('div'); av.className = 'avatar'; av.textContent = sender === 'user' ? '👤' : '🤖';
const b = document.createElement('div'); b.className = 'bubble';
const ct = document.createElement('div'); ct.className = 'bubble-content';
if (isHtml) ct.innerHTML = text; else ct.textContent = text;
b.appendChild(ct);
if (sender === 'ai') {
const a = document.createElement('div'); a.className = 'bubble-actions';
a.innerHTML = '<button class="action-btn" onclick="copyText(this)">📋 Salin</button>';
b.appendChild(a);
}
m.appendChild(av); m.appendChild(b); c.appendChild(m);
c.scrollTop = c.scrollHeight;
return ct;
}
function showTyping() {
const c = document.getElementById('chatContainer');
const m = document.createElement('div'); m.className = 'message ai'; m.id = 'typingMsg';
m.innerHTML = '<div class="avatar"></div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
c.appendChild(m); c.scrollTop = c.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typingMsg'); if (t) t.remove(); }
function copyText(btn) {
const t = btn.closest('.bubble').querySelector('.bubble-content').innerText;
navigator.clipboard.writeText(t).then(() => { btn.textContent = '✅ Tersalin'; setTimeout(() => btn.textContent = '📋 Salin', 2000); });
}

async function sendMessage() {
const inp = document.getElementById('chatInput');
const q = inp.value.trim();
if (!q || isProcessing) return;
isProcessing = true;
document.getElementById('sendBtn').disabled = true;
setStatus('Memproses...', 'online');
inp.value = '';
autoResize(inp);
addMessage(q, 'user');
showTyping();

const intent = detectIntent(q);

try {
let html = '', usedSearch = false, usedAI = false, usedAPI = false;

// === PRIORITAS 1: QURAN ===
if (intent.type === 'quran') {
setStatus('Mengambil data Al-Quran...', 'online');
const quranData = await fetchQuranData(intent);
if (quranData) {
usedAPI = true;
let count = intent.count || quranData.count;
const ayahsToShow = quranData.ayahs.slice(0, count);
html = `<strong>📖 Surah ${quranData.surahName} (${quranData.surahNameAr})</strong><br>`;

html += `<div class="sacred-text">${ayah.arabic}</div>`;
html += `<div class="translation-text"><strong>📖 Terjemahan:</strong><br>${ayah.translation}</div>`;
html += `</div>`;
});
html += `<div class="source-text">📚 Sumber: API Al-Quran Cloud (quran-uthmani & id.indonesian)</div>`;
if (/\b(tafsir|makna|penjelasan|arti)\b/i.test(q)) {
html += `<br><strong>📚 Tafsir Ringkas:</strong><br>`;
const tafsirPrompt = `Berikan tafsir ringkas dalam bahasa Indonesia untuk Surah ${quranData.surahName} ayat 1-${ayahsToShow.length}. Sertakan asbabun nuzul jika ada, dan pelajaran yang bisa diambil. Gunakan format yang rapi dengan teks Arab berharakat jika ada kutipan.`;
const tafsirResult = await getAIResponse(tafsirPrompt, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (tafsirResult.success) { html += tafsirResult.text; usedAI = true; }
}
} else {
const aiResult = await getAIResponse(q, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (aiResult.success) { html = aiResult.text; usedAI = true; } else { throw new Error('Gagal mengambil data Quran'); }
}
}
// === PRIORITAS 2: HADITS ===
else if (intent.type === 'hadith') {
setStatus('Mengambil data Hadits...', 'online');
const hadithData = await fetchHadithData(intent);
if (hadithData) {
usedAPI = true;
html = `<strong>📚 Hadits ${hadithData.book}</strong><br>`;
html += `<em style="color:#94a3b8;font-size:0.85em;">Nomor: ${hadithData.number}</em><br><br>`;
html += `<div class="sacred-text">${hadithData.arabic}</div>`;
html += `<div class="translation-text"><strong>📖 Terjemahan:</strong><br>${hadithData.translation}</div>`;
html += `<div class="source-text">📚 Sumber: API Hadits Gading Dev</div>`;
if (/\b(jelaskan|penjelasan|makna|tafsir|syarah|derajat|sanad)\b/i.test(q)) {
html += `<br><strong>📖 Penjelasan:</strong><br>`;
const syarahPrompt = `Berikan penjelasan/syarah singkat dalam bahasa Indonesia untuk hadits berikut:\nArab: ${hadithData.arabic}\nTerjemahan: ${hadithData.translation}\nSertakan: derajat hadits, pelajaran utama, dan konteks. Gunakan teks Arab berharakat jika perlu.`;
const syarahResult = await getAIResponse(syarahPrompt, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (syarahResult.success) { html += syarahResult.text; usedAI = true; }
}
} else {
const aiResult = await getAIResponse(q, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (aiResult.success) { html = aiResult.text; usedAI = true; } else { throw new Error('Gagal mengambil data Hadits'); }
}
}
// === PRIORITAS 3: ISLAM UMUM ===
else if (intent.type === 'islamic') {
setStatus('Menganalisis khazanah Islam...', 'online');
setApiStatus('Islamic AI Engine Active');
const searchResult = await searchWeb(q);
const context = searchResult.success ? searchResult.context : null;
const aiResult = await getAIResponse(q, context, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (aiResult.success) { html = aiResult.text; usedAI = true; if (searchResult.success) usedSearch = true; }
else {
const aiResult2 = await getAIResponse(q, null, ISLAMIC_SYSTEM_PROMPT, 0.3);
if (aiResult2.success) { html = aiResult2.text; usedAI = true; }
else { throw new Error('AI gagal merespons'); }
}
}
// === PRIORITAS 4: AGAMA UMUM LAINNYA ===
else if (intent.type === 'religious_general') {
const searchResult = await searchWeb(q);
if (searchResult.success) {
const aiResult = await getAIResponse(q, searchResult.context, null, 0.4);
if (aiResult.success) { html = aiResult.text; usedSearch = true; usedAI = true; }
else { throw new Error('AI gagal'); }
} else {
const aiResult = await getAIResponse(q, null, null, 0.4);
if (aiResult.success) { html = aiResult.text; usedAI = true; }
else { throw new Error('AI gagal'); }
}
}
// === PRIORITAS 5: TOKOH ===
else if (intent.type === 'figure') {
const f = intent.figure;
html = `<strong>👤 ${f.name}</strong><br><br><table>
<tr><td>Nama</td><td><strong>${f.name}</strong></td></tr>
<tr><td>Peran</td><td>${f.role}</td></tr>
<tr><td>Lahir</td><td>📅 ${f.birth}</td></tr>
<tr><td>Wafat/Status</td><td>${f.death ? '🕊️ ' + f.death : '✅ Masih Hidup'}</td></tr>
${f.note ? `<tr><td>Catatan</td><td>${f.note}</td></tr>` : ''}
</table><div style="margin-top:10px;font-size:0.8em;color:#94a3b8;border-top:1px solid #334155;padding-top:8px;">
<span class="api-badge verified-badge">✅ Data Terverifikasi</span></div>`;
}
// === PRIORITAS 6: RELIGIOUS DB ===
else if (intent.type === 'religious') {
const c = intent.content;
html = `<strong>📜 ${c.name} <span style="font-size:0.8em;color:#94a3b8;">(${c.religion})</span></strong><br><br>
<div class="sacred-text">${c.text}</div>

<span class="api-badge verified-badge">✅ Teks Terverifikasi</span></div>`;

// === PRIORITAS 7: UMUM ===
else {
const searchResult = await searchWeb(q);
if (searchResult.success) {
const aiResult = await getAIResponse(q, searchResult.context, null, 0.5);
if (aiResult.success) { html = aiResult.text; usedSearch = true; usedAI = true; }
else { throw new Error('AI gagal'); }
} else {
const aiResult = await getAIResponse(q, null, null, 0.5);
if (aiResult.success) { html = aiResult.text; usedAI = true; }
else { throw new Error('AI gagal'); }

// Tambahkan badge sumber

if (intent.type === 'quran') html += `<span class="api-badge verified-badge">📖 Quran API</span>`;
else if (intent.type === 'hadith') html += `<span class="api-badge verified-badge">📚 Hadith API</span>`;
else if (intent.type === 'islamic') html += `<span class="api-badge verified-badge">🕌 Islamic AI Engine</span>`;

html += `</div>`;

removeTyping();
addMessage(html, 'ai', true);
setStatus('Selesai', 'online');

} catch (e) {

// ==========================================
// FALLBACK CERDAS: JANGAN PERNAH BERI LINK PENCARIAN KE PENGGUNA

// ==========================================

}
addMessage(fallbackHtml, 'ai', true);
setStatus('Selesai (Mode Offline Cerdas)', 'online');

inp.focus();
}
}

function startVoice() {
if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
alert('Browser tidak mendukung input suara. Gunakan Chrome.'); return;
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = new SR(); rec.lang = 'id-ID'; rec.interimResults = false;
const btn = document.querySelector('.input-btn');
btn.textContent = '🔴'; btn.style.color = '#ef4444';
rec.onresult = (e) => { document.getElementById('chatInput').value = e.results[0][0].transcript; autoResize(document.getElementById('chatInput')); };
rec.onend = rec.onerror = () => { btn.textContent = '🎤'; btn.style.color = '#94a3b8'; };
rec.start();
}

window.onload = () => {
document.getElementById('chatContainer').innerHTML = getWelcomeHTML();
document.getElementById('chatInput').focus();
};
